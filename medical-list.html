<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Medical · Drift Destination</title>
  <script src="photo-defaults.js"></script>
  <script src="favs.js"></script>
  <style>
    html, body {
      margin: 0; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif;
      height: auto !important; min-height: 100%;
      overflow-x: hidden !important; overflow-y: auto !important;
      -webkit-overflow-scrolling: touch !important;
    }
    .hero-bg {
      position: fixed; inset: 0; z-index: 0;
      background: linear-gradient(160deg,#041018,#0c4a6e), url("assets/hero-whitsundays.jpg") center/cover;
    }
    .wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 12px 14px 100px; }
    .top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .back { color: #5eead4; text-decoration: none; font-size: 1.3rem; }
    .title { margin: 0; font-size: 1.2rem; font-weight: 800; flex: 1; }
    .card {
      position: relative; display: flex; gap: 12px; align-items: stretch;
      padding: 10px; margin: 0 0 10px; border-radius: 14px; color: inherit;
      background: rgba(8,28,44,0.62); border: 1px solid rgba(255,255,255,0.12);
    }
    .card-hit { position: absolute; inset: 0; z-index: 1; border-radius: 14px; }
    .card-body { flex: 1; min-width: 0; position: relative; z-index: 0; display: flex; flex-direction: column; justify-content: center; }
    .card-photo {
      width: 88px; min-height: 88px; flex-shrink: 0; border-radius: 10px; object-fit: cover;
      background: rgba(0,0,0,0.25); position: relative; z-index: 0;
    }
    .card-top { display: flex; align-items: flex-start; gap: 8px; }
    .card-name { font-weight: 700; font-size: 0.95rem; line-height: 1.25; flex: 1; }
    .card-meta { font-size: 0.75rem; opacity: 0.8; margin-top: 3px; }
    .card-rating { font-size: 0.72rem; color: #fbbf24; margin-top: 4px; font-weight: 600; }
    .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; position: relative; z-index: 2; }
    .btn {
      display: inline-block; padding: 7px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 600;
      text-decoration: none; border: 1px solid rgba(255,255,255,0.2); color: #e2e8f0; background: rgba(255,255,255,0.08);
    }
    .btn-call { background: #2dd4bf; color: #042f2e; border-color: transparent; font-weight: 700; }
    .heart-btn {
      position: relative; z-index: 2; border: none; background: transparent; color: rgba(255,255,255,0.45);
      font-size: 1.15rem; cursor: pointer; padding: 0 2px; line-height: 1;
    }
    .heart-btn.on { color: #f472b6; }
    .empty { opacity: 0.75; text-align: center; padding: 40px 12px; }
    .add-listing {
      display: block; max-width: 240px; margin: 22px auto 8px; padding: 11px 18px;
      border-radius: 12px; text-decoration: none; text-align: center;
      background: rgba(8, 47, 73, 0.55); border: 1.5px solid rgba(94, 234, 212, 0.75);
    }
    .add-listing span { color: #5eead4; font-weight: 700; font-size: 0.9rem; }

  </style>
</head>
<body>
  <div class="hero-bg" aria-hidden="true"></div>
  <div class="wrap">
    <div class="top">
      <a class="back" href="medical.html">←</a>
      <h1 class="title" id="title">Medical</h1>
    </div>
    <div id="list"><p class="empty">Loading…</p></div>
    <a class="add-listing" href="signup.html"><span>Add your business +</span></a>
  </div>
  <script>
    function destId() {
      try {
        return (localStorage.getItem("drift_destination_v1") || "whitsundays")
          .trim().toLowerCase().replace(/-/g, "_") || "whitsundays";
      } catch (e) { return "whitsundays"; }
    }
    function esc(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
    }
    function isReal(v) {
      const s = String(v || "").trim();
      return s && s.toLowerCase() !== "n/a" && s !== "-" && s !== "none";
    }
    const TITLES = {"gp":"GP / Medical centre","chemist":"Chemist / Pharmacy","dentist":"Dentist","physio":"Physio","allied":"Allied health","vet":"Vet","optometrist":"Optometrist","chiro":"Chiropractor"};
    const params = new URLSearchParams(location.search);
    const typeFilter = (params.get("type") || params.get("cat") || "").trim().toLowerCase();
    if (typeFilter && TITLES[typeFilter]) {
      document.getElementById("title").textContent = TITLES[typeFilter];
    } else if (typeFilter) {
      document.getElementById("title").textContent = typeFilter.replace(/-/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    }
    function isCat(r) {
      const c = String(r.category || r.Category || "").toLowerCase();
      return c.indexOf("medical") >= 0 || c.indexOf("pharmac") >= 0;
    }
    function rowMatch(r) {
      if (!isCat(r)) return false;
      if (!typeFilter) return true;
      const type = String(r.Type || r.type || r.subcategory || "").toLowerCase();
      const name = String(r.name || r["Business Name"] || "").toLowerCase();
      const blob = type + " " + name;
      
      if (typeFilter === "gp") return /gp|medical centre|medical center/i.test(blob);
      if (typeFilter === "chemist") return /chemist|pharmacy/i.test(blob);
      if (typeFilter === "dentist") return /dentist|dental/i.test(blob);
      if (typeFilter === "physio") return /physio/i.test(blob);
      if (typeFilter === "allied") return /allied|pathology|counselling|counseling|psychology/i.test(blob);
      if (typeFilter === "vet") return /\bvet\b|veterinary/i.test(blob);
      if (typeFilter === "optometrist") return /optometrist|optician/i.test(blob);
      if (typeFilter === "chiro") return /chiro/i.test(blob);
      return true;
    
      return false;
    }
    function defaultPhoto(type) {
      if (window.driftPhotoFor) {
        try { return window.driftPhotoFor({ type: type, category: "Medical" }) || "assets/default-wellness.jpg"; }
        catch (e) {}
      }
      return "assets/default-wellness.jpg";
    }
    fetch("data/" + destId() + "/businesses.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (rows) {
        var list = (Array.isArray(rows) ? rows : []).filter(rowMatch);
        list.sort(function (a, b) {
          return String(a.name || a["Business Name"] || "").localeCompare(String(b.name || b["Business Name"] || ""));
        });
        var el = document.getElementById("list");
        if (!list.length) {
          el.innerHTML = '<p class="empty">No listings in this category yet.</p>';
          return;
        }
        el.innerHTML = list.map(function (r) {
          var name = r.name || r["Business Name"] || "Business";
          var type = r.type || r.Type || "";
          var loc = r.locality || r.Locality || "";
          var phone = r.phone || r.Phone || "";
          var web = r.website || r.Website || r["Official Website"] || "";
          var photo = r.photo || r.Photo || "";
          if (!photo) photo = defaultPhoto(type);
          var placeUrl = "place.html?name=" + encodeURIComponent(name) +
            "&type=" + encodeURIComponent(type) +
            "&locality=" + encodeURIComponent(loc) +
            "&phone=" + encodeURIComponent(phone) +
            "&website=" + encodeURIComponent(web) +
            "&address=" + encodeURIComponent(r.address || r.Address || "") +
            "&photo=" + encodeURIComponent(photo);
          var actions = "";
          if (isReal(phone)) {
            var tel = String(phone).replace(/\s+/g, "");
            actions += '<a class="btn btn-call" href="tel:' + tel + '">Call</a>';
          }
          if (isReal(web)) {
            var href = String(web);
            if (href && href.indexOf("http") !== 0) href = "https://" + href;
            actions += '<a class="btn" href="' + esc(href) + '" target="_blank" rel="noopener">Website</a>';
          }
          var rating = r.rating || r.Rating || r["Google Rating"] || "";
          var reviews = r.reviews || r.Reviews || r["Google Review Count"] || "";
          var ratingHtml = "";
          if (rating && String(rating).toLowerCase() !== "none" && String(rating) !== "nan") {
            ratingHtml = '<div class="card-rating">★ ' + esc(String(rating)) +
              (reviews && String(reviews) !== "None" && String(reviews) !== "nan" ? " · " + esc(String(reviews)) : "") +
              "</div>";
          }
          var isFav = window.driftIsFav ? window.driftIsFav(name) : false;
          var heartCls = isFav ? "heart-btn on" : "heart-btn";
          var heartChar = isFav ? "♥" : "♡";
          return (
            '<div class="card">' +
              '<a class="card-hit" href="' + placeUrl + '" aria-label="' + esc(name) + '"></a>' +
              '<div class="card-body">' +
                '<div class="card-top">' +
                  '<div class="card-name">' + esc(name) + "</div>" +
                  '<button type="button" class="' + heartCls + '" data-fav="' + esc(name) + '" aria-label="Favourite">' + heartChar + "</button>" +
                "</div>" +
                '<div class="card-meta">' + esc(type) + (loc ? " · " + esc(loc) : "") + "</div>" +
                ratingHtml +
                (actions ? '<div class="card-actions">' + actions + "</div>" : "") +
              "</div>" +
              '<img class="card-photo" src="' + esc(photo) + '" alt="" loading="lazy"/>' +
            "</div>"
          );
        }).join("");
        el.querySelectorAll(".heart-btn").forEach(function (btn) {
          btn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            if (window.driftToggleFav) window.driftToggleFav(btn.getAttribute("data-fav"), btn);
          });
        });
      })
      .catch(function () {
        document.getElementById("list").innerHTML = '<p class="empty">Could not load listings.</p>';
      });
  </script>
</body>
</html>
