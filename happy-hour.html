<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a1628"/>
  <title>Happy Hour · Drift Destination</title>
  <script src="photo-defaults.js"></script>
  <script src="favs.js"></script>
  <style>
    html, body {
      margin: 0; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif;
      height: auto !important; min-height: 100%;
      overflow-x: hidden !important; overflow-y: auto !important;
      -webkit-overflow-scrolling: touch !important;
      background: #0a1628;
    }
    .hero-bg {
      position: fixed; inset: 0; z-index: 0;
      background: linear-gradient(160deg,#041018,#0c4a6e), url("assets/hero-whitsundays.jpg") center/cover;
    }
    .wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 12px 14px 100px; }
    .top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .back { color: #5eead4; text-decoration: none; font-size: 1.3rem; }
    .title { margin: 0; font-size: 1.2rem; font-weight: 800; flex: 1; }
    .card {
      position: relative; display: flex; gap: 12px; align-items: stretch;
      padding: 10px; margin: 0 0 10px; border-radius: 14px; color: inherit;
      background: rgba(8,28,44,0.62); border: 1px solid rgba(255,255,255,0.12);
    }
    .card-hit { position: absolute; inset: 0; z-index: 1; border-radius: 14px; }
    .card-body { flex: 1; min-width: 0; position: relative; z-index: 0; display: flex; flex-direction: column; justify-content: center; }
    .card-photo {
      width: 88px; min-height: 88px; flex-shrink: 0; border-radius: 10px; object-fit: cover;
      background: rgba(0,0,0,0.25); position: relative; z-index: 0;
    }
    .card-name { font-weight: 700; font-size: 0.98rem; line-height: 1.25; }
    .card-meta { font-size: 0.78rem; opacity: 0.72; margin-top: 2px; }
    .card-offer { font-size: 0.86rem; margin-top: 4px; color: #fde68a; font-weight: 600; }
    .card-when { font-size: 0.75rem; opacity: 0.65; margin-top: 2px; }
    .card-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; position: relative; z-index: 2; }
    .btn {
      font-size: 0.72rem; font-weight: 700; padding: 6px 11px; border-radius: 999px;
      text-decoration: none; color: #e2e8f0;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18);
    }
    .btn-call { background: rgba(45,212,191,0.22); border-color: rgba(94,234,212,0.4); color: #5eead4; }
    .empty { opacity: 0.7; padding: 24px 8px; text-align: center; }
    .add-listing { display: block; text-align: center; margin: 18px 0 8px; text-decoration: none; }
    .add-listing span { color: #5eead4; font-weight: 700; font-size: 0.88rem; }
    .heart-btn {
      position: relative; z-index: 2; background: transparent; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px; width: 32px; height: 32px; color: #94a3b8; font-size: 0.95rem; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; margin-left: 6px;
    }
    .heart-btn.on { color: #fb7185; border-color: rgba(251,113,133,0.5); }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
  </style>
</head>
<body>
  <div class="hero-bg" aria-hidden="true"></div>
  <div class="wrap">
    <div class="top">
      <a class="back" href="index.html">←</a>
      <h1 class="title">Happy Hour</h1>
    </div>
    <div id="list"><p class="empty">Loading…</p></div>
    <a class="add-listing" href="signup.html?intent=happy-hour"><span>Add your happy hour +</span></a>
  </div>
  <script>
    function destId() {
      try {
        return (localStorage.getItem("drift_destination_v1") || "whitsundays")
          .trim().toLowerCase().replace(/-/g, "_") || "whitsundays";
      } catch (e) { return "whitsundays"; }
    }
    function esc(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    function isReal(v) {
      const s = String(v || "").trim();
      return s && s.toLowerCase() !== "n/a" && s !== "-" && s !== "none" && s.toLowerCase() !== "nan";
    }
    function norm(s) {
      return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    }
    function findBiz(list, name) {
      const n = norm(name);
      if (!n) return null;
      let hit = list.find(b => norm(b.name || b["Business Name"] || b.business) === n);
      if (hit) return hit;
      hit = list.find(b => {
        const bn = norm(b.name || b["Business Name"] || b.business);
        return bn && (bn.includes(n) || n.includes(bn));
      });
      return hit || null;
    }
    async function loadBiz() {
      const id = destId();
      const urls = [
        "data/" + id + "/businesses.json?t=" + Date.now(),
        "data/businesses.json?t=" + Date.now()
      ];
      for (const u of urls) {
        try {
          const r = await fetch(u);
          if (!r.ok) continue;
          const j = await r.json();
          if (Array.isArray(j)) return j;
          if (j && Array.isArray(j.businesses)) return j.businesses;
        } catch (e) {}
      }
      return [];
    }
    async function loadHours() {
      try {
        const res = await fetch("data/" + destId() + "/ops.json?t=" + Date.now());
        if (!res.ok) throw new Error("no ops");
        const data = await res.json();
        const today = new Date().toISOString().slice(0, 10);
        return (data.happy_hours || []).filter(h => {
          if ((h.status || "live") !== "live") return false;
          if (h.expires && String(h.expires) < today) return false;
          return true;
        });
      } catch (e) {
        return [];
      }
    }
    async function render() {
      const [hours, bizList] = await Promise.all([loadHours(), loadBiz()]);
      const el = document.getElementById("list");
      if (!hours.length) {
        el.innerHTML = '<p class="empty">No happy hours listed yet.</p>';
        return;
      }
      el.innerHTML = hours.map(h => {
        const name = h.business || "Venue";
        const b = findBiz(bizList, name) || {};
        const phone = isReal(b.phone || b.Phone) ? String(b.phone || b.Phone).trim() : "";
        const web = isReal(b.website || b.Website) ? String(b.website || b.Website).trim() : "";
        const webHref = web && !/^https?:\/\//i.test(web) ? "https://" + web : web;
        const loc = b.locality || b.Locality || h.suburb || "";
        const cat = b.category || b.Category || "Food & Drink";
        const type = b.type || b.Type || "Bars";
        const id = b.id || b.DriftID || name;
        const photo = (window.driftPhotoFor
          ? window.driftPhotoFor(Object.assign({}, b, { name: name, category: cat, type: type }))
          : "assets/default-bar.jpg");
        const placeUrl = "place.html?id=" + encodeURIComponent(id) +
          "&name=" + encodeURIComponent(name) +
          "&locality=" + encodeURIComponent(loc) +
          "&phone=" + encodeURIComponent(phone) +
          "&website=" + encodeURIComponent(web) +
          "&category=" + encodeURIComponent(cat) +
          "&type=" + encodeURIComponent(type) +
          "&photo=" + encodeURIComponent(photo) +
          "&rating=" + encodeURIComponent(b.rating || b["Google Rating"] || "") +
          "&reviews=" + encodeURIComponent(b.reviews || b["Google Review Count"] || "") +
          "&address=" + encodeURIComponent(b.address || b.Address || "");
        let actions = "";
        if (phone) {
          const tel = phone.replace(/[\s().-]/g, "");
          actions += '<a class="btn btn-call" href="tel:' + tel + '">Call</a>';
        }
        if (webHref) {
          actions += '<a class="btn" href="' + esc(webHref) + '" target="_blank" rel="noopener">Website</a>';
        }
        const isFav = window.driftIsFav ? window.driftIsFav(name) : false;
        const heartCls = isFav ? "heart-btn on" : "heart-btn";
        const heartChar = isFav ? "♥" : "♡";
        return (
          '<div class="card">' +
            '<a class="card-hit" href="' + placeUrl + '" aria-label="' + esc(name) + '"></a>' +
            '<div class="card-body">' +
              '<div class="card-top">' +
                '<div class="card-name">' + esc(name) + '</div>' +
                '<button type="button" class="' + heartCls + '" data-fav="' + esc(name) + '" aria-label="Favourite">' + heartChar + '</button>' +
              '</div>' +
              '<div class="card-offer">' + esc(h.offer || "") + '</div>' +
              '<div class="card-when">' + esc(h.when || "") + (loc ? " · " + esc(loc) : "") + '</div>' +
              (actions ? '<div class="card-actions">' + actions + '</div>' : '') +
            '</div>' +
            '<img class="card-photo" src="' + esc(photo) + '" alt="" loading="lazy"/>' +
          '</div>'
        );
      }).join("");
      el.querySelectorAll(".heart-btn").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          if (window.driftToggleFav) window.driftToggleFav(btn.getAttribute("data-fav"), btn);
        });
      });
    }
    render();
  </script>
</body>
</html>
