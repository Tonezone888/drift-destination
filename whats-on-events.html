<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a1628"/>
  <title>Events · Drift Destination</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      color: #fff; max-width: 430px; margin: 0 auto; min-height: 100vh;
      background: #0a1628; -webkit-font-smoothing: antialiased;
      overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    .hero-bg {
      position: fixed; inset: 0;
      background: url("assets/hero-whitsundays.jpg") center center / cover no-repeat; z-index: 0;
    }
    .hero-overlay {
      position: fixed; inset: 0;
      background: linear-gradient(180deg, rgba(8,20,40,0.55) 0%, rgba(8,20,40,0.9) 100%);
      z-index: 1;
    }
    .page { position: relative; z-index: 2; padding: 16px 16px 48px; min-height: 100vh; }
    .top {
      display: flex; align-items: center; justify-content: center;
      position: relative; margin-bottom: 18px; min-height: 36px;
    }
    .back {
      position: absolute; left: 0; width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 1.1rem; text-decoration: none;
    }
    .title {
      font-size: 1.3rem; font-weight: 700; letter-spacing: -0.03em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.35);
    }
    .section-label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: #5eead4; opacity: 0.9;
      margin: 18px 2px 10px;
    }
    .section-label:first-of-type { margin-top: 4px; }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .card {
      display: flex; gap: 14px; align-items: center;
      background: rgba(8,28,44,0.72);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px; padding: 14px;
      text-decoration: none; color: inherit;
      box-shadow: 0 6px 22px rgba(0,0,0,0.22);
    }
    .date-block {
      flex-shrink: 0; width: 52px; border-radius: 12px;
      background: rgba(94,234,212,0.12); border: 1px solid rgba(94,234,212,0.28);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 8px 4px;
    }
    .date-day { font-size: 1.35rem; font-weight: 800; line-height: 1; color: #5eead4; }
    .date-month {
      font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; opacity: 0.85; margin-top: 4px;
    }
    .info { flex: 1; min-width: 0; }
    .event-name {
      font-size: 0.98rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3;
    }
    .event-meta {
      font-size: 0.78rem; opacity: 0.72; margin-top: 5px; line-height: 1.35;
    }
    .chev { opacity: 0.45; font-size: 1.2rem; padding-left: 4px; }
    .empty { text-align: center; opacity: 0.7; padding: 48px 16px; line-height: 1.45; }
    .add-listing {
      display: block; max-width: 240px; margin: 28px auto 8px; padding: 11px 18px;
      border-radius: 12px; text-decoration: none; text-align: center;
      background: rgba(8, 47, 73, 0.55); border: 1.5px solid rgba(94, 234, 212, 0.75);
    }
    .add-listing span { color: #5eead4; font-weight: 700; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="page">
    <div class="top">
      <a class="back" href="whats-on.html" aria-label="Back">←</a>
      <h1 class="title">Events</h1>
    </div>
    <div id="root"><div class="empty">Loading…</div></div>
    <a class="add-listing" href="signup.html?intent=event"><span>Add your event +</span></a>
  </div>
  <script>
    var WEEKDAY = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
    function destId() {
      try {
        return (localStorage.getItem("drift_destination_v1") || "whitsundays")
          .trim().toLowerCase().replace(/-/g, "_") || "whitsundays";
      } catch (e) { return "whitsundays"; }
    }
    function esc(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
    }
    function ymd(d) {
      return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    }
    function parts(iso) {
      var d = new Date(iso + "T12:00:00");
      if (isNaN(d.getTime())) return { day: "–", month: "" };
      return {
        day: String(d.getDate()),
        month: d.toLocaleString("en-AU", { month: "short" }).toUpperCase()
      };
    }
    function shortWhere(w) {
      w = String(w || "").replace(/,?\s*QLD\s*\d{4}.*$/i, "").replace(/,?\s*Australia.*$/i, "").trim();
      if (w.length > 42) w = w.slice(0, 40) + "…";
      return w;
    }
    /** Next N dates for a weekly event starting from today (inclusive if matches). */
    function nextWeekdays(weekdayName, count) {
      var target = WEEKDAY[weekdayName] != null ? WEEKDAY[weekdayName] : 6;
      var out = [];
      var d = new Date();
      d.setHours(12, 0, 0, 0);
      // include today if match
      for (var i = 0; i < 60 && out.length < count; i++) {
        var cur = new Date(d.getTime());
        cur.setDate(d.getDate() + i);
        if (cur.getDay() === target) out.push(ymd(cur));
      }
      return out;
    }
    function expandEvents(raw) {
      var list = [];
      (raw || []).forEach(function (e) {
        if ((e.status || "live") !== "live") return;
        var isWeekly = (e.recurs || e.recurring || "") === "weekly" || /every\s+(week|saturday|sunday|monday|tuesday|wednesday|thursday|friday)/i.test((e.detail || "") + " " + (e.title || ""));
        var wd = e.weekday || "";
        if (!wd && isWeekly) {
          var m = ((e.detail || "") + " " + (e.title || "")).match(/every\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)/i);
          if (m) {
            var full = m[1].toLowerCase();
            wd = { monday:"Mon", tuesday:"Tue", wednesday:"Wed", thursday:"Thu", friday:"Fri", saturday:"Sat", sunday:"Sun" }[full] || "";
          }
          else if (/saturday/i.test(e.detail || "")) wd = "Sat";
          else if (/wednesday/i.test(e.detail || "")) wd = "Wed";
          else if (e.date) {
            var names = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
            var dd = new Date(e.date + "T12:00:00");
            if (!isNaN(dd.getTime())) wd = names[dd.getDay()];
          }
        }
        if (isWeekly && wd) {
          nextWeekdays(wd, 4).forEach(function (iso) {
            list.push(Object.assign({}, e, { date: iso, _instance: true }));
          });
        } else if (e.date) {
          list.push(e);
        }
      });
      var today = ymd(new Date());
      list = list.filter(function (e) { return !e.date || e.date >= today; });
      list.sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
      return list;
    }
    function cardHtml(e) {
      var p = parts(e.date);
      var meta = [e.time || "", shortWhere(e.where)].filter(Boolean).join(" · ");
      if (e.recurs === "weekly" || e.recurring === "weekly" || e._instance) {
        var label = e.weekday ? ("Every " + e.weekday) : "Weekly";
        meta = meta ? (meta + " · " + label) : label;
      }
      var url = "event.html?id=" + encodeURIComponent(e.id || "") +
        "&title=" + encodeURIComponent(e.title || "") +
        "&date=" + encodeURIComponent(e.date || "") +
        "&time=" + encodeURIComponent(e.time || "") +
        "&where=" + encodeURIComponent(e.where || "") +
        "&detail=" + encodeURIComponent(e.detail || "") +
        "&url=" + encodeURIComponent(e.url || e.link || "") +
        "&recurs=" + encodeURIComponent(e.recurs || "") +
        "&weekday=" + encodeURIComponent(e.weekday || "");
      return (
        '<a class="card" href="' + url + '">' +
          '<div class="date-block"><div class="date-day">' + esc(p.day) + '</div>' +
          '<div class="date-month">' + esc(p.month) + '</div></div>' +
          '<div class="info"><div class="event-name">' + esc(e.title || "Event") + '</div>' +
          (meta ? '<div class="event-meta">' + esc(meta) + '</div>' : '') +
          '</div><div class="chev">›</div></a>'
      );
    }
    fetch("data/" + destId() + "/ops.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .then(function (data) {
        var events = expandEvents(data.events || []);
        var root = document.getElementById("root");
        if (!events.length) {
          root.innerHTML = '<div class="empty">No upcoming events yet.<br/>Check back soon.</div>';
          return;
        }
        var weekEnd = new Date(); weekEnd.setDate(weekEnd.getDate() + 7);
        var we = ymd(weekEnd);
        var soon = events.filter(function (e) { return e.date && e.date <= we; });
        var later = events.filter(function (e) { return !e.date || e.date > we; });
        var html = "";
        if (soon.length) html += '<div class="section-label">Coming up</div><div class="list">' + soon.map(cardHtml).join("") + "</div>";
        if (later.length) html += '<div class="section-label">Later</div><div class="list">' + later.map(cardHtml).join("") + "</div>";
        root.innerHTML = html;
      })
      .catch(function () {
        document.getElementById("root").innerHTML = '<div class="empty">Could not load events.</div>';
      });
  </script>
</body>
</html>
