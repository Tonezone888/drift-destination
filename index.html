<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#071b2d">
  <title>Drift · Whitsundays</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles_home_polish.css">
</head>
<body>
  <div class="hero-bg" aria-hidden="true"></div>

  <header class="top-bar">
    <div class="brand">
      <img src="assets/drift-logo.png" alt="Drift" class="logo" width="32" height="32">
      <span>Drift</span>
    </div>
    <div class="location-pill" id="locationPill">
      <span class="pin">📍</span>
      <span id="currentDest">Whitsundays</span>
      <span class="chevron">▾</span>
    </div>
  </header>

  <main class="home">
    <section class="greeting">
      <h1 id="greetingText">Good evening</h1>
      <p>Discover the best of the Whitsundays</p>
    </section>

    <section class="tiles" id="homeTiles">
      <!-- tiles will be injected by app.js -->
    </section>
  </main>

  <nav class="bottom-nav" role="navigation">
    <button class="nav-item active" data-view="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 22V12h6v10"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" data-view="explore">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <span>Explore</span>
    </button>
    <button class="nav-item" data-view="fav">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      <span>Favourites</span>
    </button>
    <button class="nav-item" data-view="profile">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>Profile</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
