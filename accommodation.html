<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a1628"/>
  <title>Accommodation · Drift Destination</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      color: #fff; max-width: 430px; margin: 0 auto; min-height: 100vh;
      background: #0a1628; -webkit-font-smoothing: antialiased;
      overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    .hero-bg {
      position: fixed; inset: 0;
      background: url("assets/hero-whitsundays.jpg") center center / cover no-repeat; z-index: 0;
    }
    .hero-overlay {
      position: fixed; inset: 0;
      background: linear-gradient(180deg, rgba(8,20,40,0.5) 0%, rgba(8,20,40,0.9) 100%);
      z-index: 1;
    }
    .page { position: relative; z-index: 2; padding: 16px 16px 40px; min-height: 100vh; }
    .top {
      display: flex; align-items: center; justify-content: center;
      position: relative; margin-bottom: 16px; min-height: 36px;
    }
    .back {
      position: absolute; left: 0; width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 1.1rem; text-decoration: none;
    }
    .title {
      font-size: 1.3rem; font-weight: 700; letter-spacing: -0.03em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.35);
    }
    .tiles { display: flex; flex-direction: column; gap: 12px; }
    .tile {
      position: relative; display: block; height: 112px;
      border-radius: 18px; overflow: hidden; text-decoration: none; color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 8px 28px rgba(0,0,0,0.28);
    }
    .tile-img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scale(1.02);
    }
    .tile-shade {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(4,16,28,0.82) 0%, rgba(4,16,28,0.45) 55%, rgba(4,16,28,0.25) 100%);
    }
    .tile-body {
      position: relative; z-index: 1; height: 100%;
      display: flex; flex-direction: column; justify-content: center;
      padding: 16px 18px; max-width: 72%;
    }
    .tile-name {
      font-size: 1.12rem; font-weight: 750; letter-spacing: -0.02em;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .tile-sub { font-size: 0.78rem; opacity: 0.88; margin-top: 3px; line-height: 1.25; }
    .tile-count {
      font-size: 0.72rem; font-weight: 600; margin-top: 8px;
      color: #5eead4; letter-spacing: 0.01em;
    }
    .add-listing {
      display: block; max-width: 240px; margin: 28px auto 8px; padding: 11px 18px;
      border-radius: 12px; text-decoration: none; text-align: center;
      background: rgba(8, 47, 73, 0.55); border: 1.5px solid rgba(94, 234, 212, 0.75);
    }
    .add-listing span { color: #5eead4; font-weight: 700; font-size: 0.9rem; }

  </style>
</head>
<body>
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="page">
    <div class="top">
      <a class="back" href="index.html" aria-label="Back">←</a>
      <h1 class="title">Accommodation</h1>
    </div>
    <div class="tiles">
      <a class="tile" href="accommodation-list.html?type=Resort">
        <img class="tile-img" src="assets/hub-resort.jpg" alt="" loading="eager"/>
        <div class="tile-shade"></div>
        <div class="tile-body">
          <div class="tile-name">Resort</div>
          <div class="tile-sub">Full-service resorts</div>
          <div class="tile-count" data-count="resort">…</div>
        </div>
      </a>
      <a class="tile" href="accommodation-list.html?type=Apartment%20%2F%20Holiday%20unit">
        <img class="tile-img" src="assets/hub-apartment.jpg" alt="" loading="eager"/>
        <div class="tile-shade"></div>
        <div class="tile-body">
          <div class="tile-name">Apartment / Holiday unit</div>
          <div class="tile-sub">Self-contained stays</div>
          <div class="tile-count" data-count="apartment">…</div>
        </div>
      </a>
      <a class="tile" href="accommodation-list.html?type=Hotel%20%2F%20Motel">
        <img class="tile-img" src="assets/hub-hotel.jpg" alt="" loading="eager"/>
        <div class="tile-shade"></div>
        <div class="tile-body">
          <div class="tile-name">Hotel / Motel</div>
          <div class="tile-sub">Hotels &amp; motels</div>
          <div class="tile-count" data-count="hotel">…</div>
        </div>
      </a>
      <a class="tile" href="accommodation-list.html?type=Backpackers%20%2F%20Hostel">
        <img class="tile-img" src="assets/hub-backpackers.jpg" alt="" loading="eager"/>
        <div class="tile-shade"></div>
        <div class="tile-body">
          <div class="tile-name">Backpackers / Hostel</div>
          <div class="tile-sub">Budget &amp; social</div>
          <div class="tile-count" data-count="backpackers">…</div>
        </div>
      </a>
      <a class="tile" href="accommodation-list.html?type=Caravan%20%2F%20Cabin%20park">
        <img class="tile-img" src="assets/hub-caravan.jpg" alt="" loading="eager"/>
        <div class="tile-shade"></div>
        <div class="tile-body">
          <div class="tile-name">Caravan / Cabin park</div>
          <div class="tile-sub">Parks &amp; cabins</div>
          <div class="tile-count" data-count="caravan">…</div>
        </div>
      </a>
    </div>
    <a class="add-listing" href="signup.html"><span>Add your business +</span></a>
  </div>
  <script>
    function destId() {
      try {
        return (localStorage.getItem("drift_destination_v1") || "whitsundays")
          .trim().toLowerCase().replace(/-/g, "_") || "whitsundays";
      } catch (e) { return "whitsundays"; }
    }

    function bucket(r) {
      var c = String(r.category||"").toLowerCase();
      if (c.indexOf("accommodation") < 0 && c.indexOf("stay") < 0) return "";
      var t = String(r.type||r.Type||r.subcategory||"").toLowerCase();
      if (t.indexOf("resort")>=0) return "resort";
      if (t.indexOf("apartment")>=0 || t.indexOf("holiday")>=0 || t.indexOf("unit")>=0) return "apartment";
      if (t.indexOf("hotel")>=0 || t.indexOf("motel")>=0) return "hotel";
      if (t.indexOf("backpack")>=0 || t.indexOf("hostel")>=0) return "backpackers";
      if (t.indexOf("caravan")>=0 || t.indexOf("cabin")>=0) return "caravan";
      return "";
    }

    fetch("data/" + destId() + "/businesses.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (data) {
        var rows = Array.isArray(data) ? data : (data.businesses || []);
        var counts = {};
        rows.forEach(function (r) {
          var b = bucket(r);
          if (b) counts[b] = (counts[b] || 0) + 1;
        });
        document.querySelectorAll("[data-count]").forEach(function (el) {
          var n = counts[el.getAttribute("data-count")] || 0;
          el.textContent = n > 0 ? (n + (n === 1 ? " listing" : " listings")) : "";
        });
      })
      .catch(function () {
        document.querySelectorAll("[data-count]").forEach(function (el) { el.textContent = ""; });
      });
  </script>
</body>
</html>
