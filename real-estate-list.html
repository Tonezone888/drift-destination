<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Real Estate · Drift Destination</title>
  <link rel="stylesheet" href="styles.css"/>
  <script src="favs.js"></script>
  <script src="list-sort.js"></script>
  <style>
    html, body {
      margin: 0; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif;
      height: auto !important; min-height: 100%;
      overflow-x: hidden !important; overflow-y: auto !important;
      -webkit-overflow-scrolling: touch !important;
    }
    .hero-bg {
      position: fixed; inset: 0; z-index: 0;
      background: linear-gradient(160deg,#041018,#0c4a6e), url("assets/hero-whitsundays.jpg") center/cover;
    }
    .wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 12px 14px 100px; }
    .top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .back { color: #5eead4; text-decoration: none; font-size: 1.3rem; }
    .title { margin: 0; font-size: 1.2rem; font-weight: 800; flex: 1; }
    .card {
      position: relative; display: flex; gap: 12px; align-items: stretch;
      padding: 10px; margin: 0 0 10px; border-radius: 14px; color: inherit;
      background: rgba(8,28,44,0.62); border: 1px solid rgba(255,255,255,0.12);
    }
    .card-hit { position: absolute; inset: 0; z-index: 1; border-radius: 14px; }
    .card-body { flex: 1; min-width: 0; z-index: 0; display: flex; flex-direction: column; justify-content: center; }
    .card-photo {
      width: 88px; min-height: 88px; flex-shrink: 0; border-radius: 10px; object-fit: cover;
      background: #0c4a6e; z-index: 0;
    }
    .card-name { font-weight: 700; font-size: 0.95rem; line-height: 1.25; }
    .card-meta { font-size: 0.75rem; opacity: 0.8; margin-top: 3px; }
    .card-top { display: flex; align-items: flex-start; gap: 8px; }
    .card-top .card-name { flex: 1; }
    .heart-btn {
      position: relative; z-index: 2; flex-shrink: 0;
      width: 32px; height: 32px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1); color: #fff; font-size: 0.95rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .heart-btn.on { color: #fb7185; }
    .card-rating { font-size: 0.75rem; margin-top: 3px; color: #fbbf24; font-weight: 600; }
    .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; position: relative; z-index: 2; }
    .btn {
      display: inline-block; padding: 7px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 600;
      text-decoration: none; border: 1px solid rgba(255,255,255,0.2); color: #e2e8f0; background: rgba(255,255,255,0.08);
    }
    .btn-call { background: #2dd4bf; color: #042f2e; border-color: transparent; font-weight: 700; }
    .empty { opacity: 0.75; text-align: center; padding: 40px 12px; line-height: 1.4; }
    .add-listing {
      display: block; max-width: 240px; margin: 28px auto 16px; padding: 9px 16px; border-radius: 11px;
      text-decoration: none; text-align: center; background: rgba(8, 47, 73, 0.55);
      border: 1.5px solid rgba(94, 234, 212, 0.75);
    }
    .add-listing span { color: #5eead4; font-weight: 700; font-size: 0.88rem; }
  
    .verified-badge {
      display: inline-block; margin-left: 6px; padding: 1px 7px;
      border-radius: 999px; font-size: 0.65rem; font-weight: 700;
      background: rgba(45, 212, 191, 0.25); color: #5eead4;
      border: 1px solid rgba(94, 234, 212, 0.45); vertical-align: middle;
    }

  </style>
</head>
<body>
  <div class="hero-bg" aria-hidden="true"></div>
  <div class="wrap">
    <div class="top">
      <a class="back" href="real-estate.html">←</a>
      <h1 class="title" id="title">Real Estate</h1>
    </div>
    <div id="list"><p class="empty">Loading…</p></div>
    <a class="add-listing" href="signup.html"><span>Add your business +</span></a>
  </div>
  <script>
    function destId() {
      try {
        return (localStorage.getItem("drift_destination_v1") || "whitsundays")
          .trim().toLowerCase().replace(/-/g, "_") || "whitsundays";
      } catch (e) { return "whitsundays"; }
    }
    function esc(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
    }
    function isReal(v) {
      const s = String(v || "").trim();
      return s && !["n/a","none","-","na"].includes(s.toLowerCase());
    }
    const params = new URLSearchParams(location.search);
    // Hub uses ?cat=agents | agencies | managers
    const typeFilter = (params.get("cat") || params.get("type") || "").trim().toLowerCase();
    if (typeFilter) {
      const labels = { agents: "Agents", agencies: "Agencies", managers: "Property managers" };
      document.getElementById("title").textContent = labels[typeFilter] || typeFilter;
    }

    function isRealEstate(r) {
      const c = String(r.category || r.Category || "").toLowerCase();
      return c.indexOf("real estate") >= 0;
    }

    function bucket(r) {
      // Returns 'agency' | 'agent' | 'manager' | 'other'
      const type = String(r.type || r.Type || r.subcategory || "").toLowerCase();
      const sub = String(r.subcategory || "").toLowerCase();
      const blob = type + " " + sub;
      if (blob.indexOf("manager") >= 0 || blob.indexOf("management") >= 0 ||
          blob.indexOf("strata") >= 0 || blob.indexOf("body corporate") >= 0) {
        return "manager";
      }
      if (blob.indexOf("agenc") >= 0) return "agency";
      if (blob.indexOf("agent") >= 0 || blob.indexOf("sales") >= 0) return "agent";
      // Publish may set subcategory agent|agency|manager
      if (sub === "agent" || sub === "agents") return "agent";
      if (sub === "agency" || sub === "agencies") return "agency";
      if (sub === "manager" || sub === "managers") return "manager";
      return "other";
    }

    function rowMatch(r) {
      if (!isRealEstate(r)) return false;
      const name = String(r.name || r["Business Name"] || "").toLowerCase();
      const blocked = ["australia post", "flight centre", "nomads", "travel shop",
        "we do cars", "scooter", "fraser tour", "booking office", "oceanic marine"];
      if (blocked.some(b => name.indexOf(b) >= 0)) return false;

      if (!typeFilter) return true;
      const b = bucket(r);
      if (typeFilter.indexOf("agenc") >= 0) return b === "agency";
      if (typeFilter.indexOf("agent") >= 0) return b === "agent";
      if (typeFilter.indexOf("manager") >= 0 || typeFilter.indexOf("propert") >= 0) return b === "manager";
      return true;
    }

    fetch("data/" + destId() + "/businesses.json?t=" + Date.now(), { cache: "no-store" })
      .then(r => r.ok ? r.json() : [])
      .then(data => {
        let rows = Array.isArray(data) ? data : (data.businesses || []);
        if (!Array.isArray(rows)) rows = [];
        const allRE = rows.filter(isRealEstate);
        rows = rows.filter(rowMatch);
        const el = document.getElementById("list");
        if (!rows.length) {
          el.innerHTML =
            '<p class="empty">No listings in this filter.<br/>' +
            'Real Estate in publish data: ' + allRE.length + '<br/>' +
            'Set Type to Agency / Agent / Property manager in Operator, then Publish.</p>';
          return;
        }
        rows = (window.driftSortListings ? window.driftSortListings(rows) : rows);
        el.innerHTML = rows.map(r => {
          const name = r.name || r["Business Name"] || r.Name || "Business";
          const type = r.type || r.Type || r.subcategory || "";
          const loc = r.locality || r.Locality || "";
          const phone = isReal(r.phone || r.Phone) ? String(r.phone || r.Phone).trim() : "";
          const web = isReal(r.website || r.Website) ? String(r.website || r.Website).trim() : "";
          const webHref = web && !/^https?:\/\//i.test(web) ? "https://" + web : web;
          // PHOTO: real path or forced generic — never blank
          let photo = "assets/default-real-estate.jpg";
          const raw = String(r.photo || r.Photo || "").trim();
          if (raw && (raw.indexOf("data/") === 0 || raw.indexOf("http") === 0 || raw.indexOf("photos/") >= 0)) {
            photo = raw;
          }
          const rating = r.rating || r["Google Rating"] || "";
          const reviews = r.reviews || r["Google Review Count"] || "";
          let ratingHtml = "";
          if (rating && String(rating).toLowerCase() !== "none") {
            ratingHtml = '<div class="card-rating">★ ' + esc(String(rating)) +
              (reviews ? " · " + esc(String(reviews)) : "") + "</div>";
          }
          const placeUrl = "place.html?id=" + encodeURIComponent(name) +
            "&name=" + encodeURIComponent(name) +
            "&locality=" + encodeURIComponent(loc) +
            "&phone=" + encodeURIComponent(phone) +
            "&website=" + encodeURIComponent(web) +
            "&category=Real%20Estate" +
            "&type=" + encodeURIComponent(type) +
            "&photo=" + encodeURIComponent(photo) +
            "&rating=" + encodeURIComponent(rating) +
            "&reviews=" + encodeURIComponent(reviews);
          let actions = "";
          if (phone) {
            actions += '<a class="btn btn-call" href="tel:' + phone.replace(/[\s().-]/g, "") + '">Call</a>';
          }
          if (webHref) {
            actions += '<a class="btn" href="' + esc(webHref) + '" target="_blank" rel="noopener">Website</a>';
          }
          const isFav = window.driftIsFav ? window.driftIsFav(name) : false;
          return (
            '<div class="card">' +
              '<a class="card-hit" href="' + placeUrl + '" aria-label="' + esc(name) + '"></a>' +
              '<div class="card-body">' +
                '<div class="card-top">' +
                  '<div class="card-name">' + esc(name) +
                  (window.driftIsVerified && window.driftIsVerified(r) ? '<span class="verified-badge">Verified</span>' : '') +
                '</div>' +
                  '<button type="button" class="heart-btn' + (isFav ? " on" : "") + '" data-fav="' + esc(name) + '">' +
                    (isFav ? "♥" : "♡") + '</button>' +
                '</div>' +
                '<div class="card-meta">' + esc(type) + (loc ? " · " + esc(loc) : "") + '</div>' +
                ratingHtml +
                (actions ? '<div class="card-actions">' + actions + '</div>' : '') +
              '</div>' +
              '<img class="card-photo" src="' + esc(photo) + '" alt="" loading="lazy" ' +
                'onerror="this.onerror=null;this.src=\'assets/default-real-estate.jpg\';"/>' +
            '</div>'
          );
        }).join("");
        el.querySelectorAll(".heart-btn").forEach(function (btn) {
          btn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            if (window.driftToggleFav) window.driftToggleFav(btn.getAttribute("data-fav"), btn);
          });
        });
      })
      .catch(function () {
        document.getElementById("list").innerHTML = '<p class="empty">Could not load listings.</p>';
      });
  </script>
</body>
</html>
