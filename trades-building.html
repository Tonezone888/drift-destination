<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a1628"/>
  <title>Building · Drift Destination</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      color: #fff; max-width: 430px; margin: 0 auto; min-height: 100vh;
      background: #0a1628; position: relative; -webkit-font-smoothing: antialiased;
    }
    .hero-bg {
      position: fixed; inset: 0;
      background: url("assets/hero-whitsundays.jpg") center center / cover no-repeat; z-index: 0;
    }
    .hero-overlay {
      position: fixed; inset: 0;
      background: linear-gradient(180deg, rgba(8,20,40,0.55) 0%, rgba(8,20,40,0.88) 100%);
      z-index: 1;
    }
    .page {
      position: relative; z-index: 2; padding: 18px 16px 34px; min-height: 100vh;
      display: flex; flex-direction: column;
    }
    .top {
      display: flex; align-items: center; justify-content: center;
      position: relative; margin-bottom: 20px; min-height: 36px;
    }
    .back {
      position: absolute; left: 0; width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 1.1rem; text-decoration: none;
    }
    .title {
      font-size: 1.3rem; font-weight: 700; letter-spacing: -0.03em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3); text-align: center;
    }

    .list-bars { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .bar {
      display: flex; align-items: center; gap: 14px;
      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 16px; padding: 16px 18px;
      text-decoration: none; color: inherit;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15); min-height: 64px;
    }
    .bar-icon { font-size: 1.5rem; width: 1.6em; text-align: center; flex-shrink: 0; }
    .bar-text { display: flex; flex-direction: column; gap: 2px; }
    .bar-name { font-size: 1.02rem; font-weight: 650; }
    .bar-sub { font-size: 0.75rem; opacity: 0.55; }

    .bottom-nav {
      margin-top: auto; display: flex; justify-content: space-around; align-items: center;
      padding: 10px 8px 8px; background: rgba(12, 40, 58, 0.42);
      border: 1px solid rgba(255,255,255,0.22); border-radius: 22px;
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    }
    .bottom-nav .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 0.62rem; font-weight: 500; color: rgba(255,255,255,0.7);
      text-decoration: none; padding: 4px 6px;
    }
    .bottom-nav .nav-item span:first-child { font-size: 1.05rem; }
  



    .add-listing {
      display: block;
      max-width: 240px;
      margin: 20px auto 10px;
      padding: 9px 16px;
      border-radius: 11px;
      text-decoration: none;
      text-align: center;
      background: rgba(8, 47, 73, 0.55);
      border: 1.5px solid rgba(94, 234, 212, 0.75);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .add-listing span {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #5eead4;
    }

  </style>
</head>
<body>
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="page">
    <div class="top">
      <a class="back" href="trades.html">←</a>
      <h1 class="title">Building</h1>
    </div>
    <div class="list-bars">
      <a class="bar" href="trades-list.html?cat=electricians">
        <span class="bar-icon">⚡</span>
        <div class="bar-text">
          <span class="bar-name">Electricians</span>
          <span class="bar-sub">Power, wiring & solar</span>
        </div>
      </a>
      <a class="bar" href="trades-list.html?cat=plumbers">
        <span class="bar-icon">🔧</span>
        <div class="bar-text">
          <span class="bar-name">Plumbers & gas</span>
          <span class="bar-sub">Plumbing & gas fitting</span>
        </div>
      </a>
      <a class="bar" href="trades-list.html?cat=builders">
        <span class="bar-icon">🏗️</span>
        <div class="bar-text">
          <span class="bar-name">Builders & carpenters</span>
          <span class="bar-sub">Build, reno & carpentry</span>
        </div>
      </a>
      <a class="bar" href="trades-list.html?cat=painters">
        <span class="bar-icon">🎨</span>
        <div class="bar-text">
          <span class="bar-name">Painters</span>
          <span class="bar-sub">Interior & exterior</span>
        </div>
      </a>
      <a class="bar" href="trades-list.html?cat=building-other">
        <span class="bar-icon">🧱</span>
        <div class="bar-text">
          <span class="bar-name">More building</span>
          <span class="bar-sub">Plaster, tile, roof, concrete, glass</span>
        </div>
      </a>
    </div>
                    <a class="add-listing" href="signup.html">
      <span>Add your business +</span>
    </a>

    <nav class="bottom-nav" aria-label="Main">
      <a class="nav-item" href="index.html"><span>🏠</span><span>Home</span></a>
      <a class="nav-item" href="index.html"><span>🔍</span><span>Explore</span></a>
      <a class="nav-item" href="favourites.html"><span>♥</span><span>Favourites</span></a>
      <a class="nav-item" href="index.html"><span>📅</span><span>Bookings</span></a>
      <a class="nav-item" href="settings.html"><span>👤</span><span>Profile</span></a>
    </nav>
  </div>
</body>
</html>
